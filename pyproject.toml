[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isingcr"
version = "0.1.0"
description = "Ising-model sociophysics simulation of Costa Rican electoral dynamics"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "networkx>=3.2",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
